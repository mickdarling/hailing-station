# XcodeGen spec. `xcodegen generate` produces HailingStation.xcodeproj (gitignored). Never hand-edit the project.
# Entitlements are declared here; xcodegen regenerates the .entitlements file from `entitlements.properties`.
name: HailingStation
options:
  bundleIdPrefix: com.mickdarling
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    MARKETING_VERSION: "0.1.114"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # 10-character Apple Team ID for device builds. Empty = simulator and CI only (#32).
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  Hail:
    path: .
targets:
  Hail-iOS:
    type: application
    platform: iOS
    sources:
      - Apps/Hail-iOS
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Hail
        products: [HailCore, HailProtocol]
    info:
      path: Apps/Hail-iOS/Info.plist
      properties:
        CFBundleDisplayName: Hailing Station
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: Hailing Station captures speech to send it to a host you choose. While ambient listening is on, it may also send room audio to your Mac.
        NSSpeechRecognitionUsageDescription: Hailing Station transcribes speech on this device.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      path: Apps/Hail-iOS/Hail.entitlements
      properties: {}
  # The same station views, built for the Mac (#266). Direct builds only: no signing team, sandbox or distribution.
  Hail-macOS:
    type: application
    platform: macOS
    sources:
      - path: Apps/Hail-iOS
        # The iOS Info.plist, and the routing spike (#22), which probes the iOS audio session.
        excludes: [Info.plist, RoutingProbe.swift, RoutingSpikeView.swift]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: ""
        # The shared AppIcon set already carries the Mac artwork (icon-mac-1024.png, mac 512@2x).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # XcodeGen would otherwise point INFOPLIST_FILE at the iOS plist found in the shared sources, merging
        # UIBackgroundModes, UILaunchScreen and orientation keys into the Mac app.
        INFOPLIST_FILE: ""
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hailing Station
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Hailing Station captures speech to send it to a host you choose. While ambient listening is on, it may also send room audio to that host.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Hailing Station transcribes speech on this Mac.
    dependencies:
      - package: Hail
        products: [HailCore, HailProtocol]
  Hail-iOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/Hail-iOSUITests
    dependencies:
      - target: Hail-iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mickdarling.Hail-iOSUITests
        TEST_TARGET_NAME: Hail-iOS
schemes:
  Hail-iOS:
    build:
      targets:
        Hail-iOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - Hail-iOSUITests
  Hail-macOS:
    build:
      targets:
        Hail-macOS: all
    run:
      config: Debug
