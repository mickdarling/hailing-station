# PR contract (#25, #48): size limit, spec link, review records. Re-runs when the body or labels change.
name: pr-shape

# Runs on pull_request with checkers from the base branch checkout. The workflow file comes
# from the PR, so a PR could edit its own check. This is review-enforced, like the required
# gate check in ci.yml: changes under .github/ or scripts/ are security-critical under
# pr-shape's SECURITY_PATHS, need an independent second key, and the maintainer diffs those
# changes at the exact head before merging. #1177 tracks an optional default-branch verifier.
# Nothing from the PR head is checked out or executed.
on:
  pull_request:
    types: [opened, edited, synchronize, labeled, unlabeled, reopened]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  shape:
    name: pr-shape
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # base.ref, not base.sha: the sha is frozen at the PR's last sync and predates later gate changes on main
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - name: Check PR shape
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/pr-shape.py
