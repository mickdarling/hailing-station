# Every named test in the spec's "Test expectations" must exist in the PR (#27).
# Runs on pull_request with checkers from the base branch checkout. The workflow file comes
# from the PR, so a PR could edit its own check. This is review-enforced, like the required
# gate check in ci.yml: changes under .github/ or scripts/ are security-critical under
# pr-shape's SECURITY_PATHS, need an independent second key, and the maintainer diffs those
# changes at the exact head before merging. #1177 tracks an optional default-branch verifier.
# The PR's tree is checked out to a side directory and only read, never executed.
name: traceability

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  trace:
    name: traceability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the base branch (the checker and its tests)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.ref }} # branch tip, not the PR's frozen base sha
          persist-credentials: false
      - name: Unit tests for the checker
        run: |
          python3 -m venv "$RUNNER_TEMP/spec-trace-venv"
          "$RUNNER_TEMP/spec-trace-venv/bin/python" -m pip install -r scripts/spec-trace-requirements.txt
          "$RUNNER_TEMP/spec-trace-venv/bin/python" -m unittest scripts/tests/test_trace.py
      - name: Check out the PR tree to a side directory (read only, never executed)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-tree
          persist-credentials: false
      - name: Trace spec to tests
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: '"$RUNNER_TEMP/spec-trace-venv/bin/python" scripts/spec_trace.py --tree pr-tree'
