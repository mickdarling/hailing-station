# Applies security:critical from .github/labeler.yml paths (#48). On pull_request the label configuration is
# read from the PR's own commit, so a PR could change which labels it receives; pr-shape (run from the base
# branch) independently requires security:critical and a second-key record for .github/ and scripts/ paths.
name: labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    # Fork PRs get a read-only token on pull_request and receive no automatic labels.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6
        with:
          sync-labels: false
