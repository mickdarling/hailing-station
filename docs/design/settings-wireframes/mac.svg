<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="800" viewBox="0 0 1220 800" role="img" aria-labelledby="title desc">
<title id="title">Proposed Mac settings</title><desc id="desc">Mac settings window with category sidebar, shared host and target scopes, voice form, and effective-value inspector. Per-target voice is explicitly proposed under issue 1124, not current shipped behavior.</desc>
<rect width="1220" height="800" fill="#eef1f5"/>
<g font-family="-apple-system, sans-serif" fill="#172234"><text x="28" y="38" font-size="24" font-weight="700">Mac · Settings window and station entry share one coordinator</text>
<rect x="20" y="64" width="1180" height="666" rx="18" fill="#fff" stroke="#a5aebd"/>
<rect x="20" y="64" width="1180" height="50" rx="18" fill="#e2e6ed"/><circle cx="42" cy="89" r="6" fill="#a32b36"/><circle cx="62" cy="89" r="6" fill="#ad7300"/><circle cx="82" cy="89" r="6" fill="#27704c"/><text x="510" y="95" font-size="19" font-weight="600">Hailing Station Settings</text>
<path d="M266 114V730M908 114V730" stroke="#dce1e9"/>
<rect x="34" y="134" width="216" height="38" rx="8" fill="#edf0f5"/><text x="48" y="159" font-size="16">Search settings</text>
<g font-size="17"><text x="42" y="218">Listening and attention</text><text x="42" y="268">Privacy</text></g><rect x="32" y="291" width="222" height="42" rx="8" fill="#e7eefb"/><text x="42" y="319" font-size="17" fill="#2057bd">Voices and replies</text><g font-size="17"><text x="42" y="370">Notifications and updates</text><text x="42" y="420">Targets</text><text x="42" y="470">Audio</text><text x="42" y="520">Appearance</text><text x="42" y="570">Advanced and diagnostics</text></g>
<text x="42" y="662" font-size="16" fill="#a32b36">● Mic live · Listening</text><text x="42" y="691" font-size="14" fill="#45536a">Command-comma opens here</text>
<text x="288" y="157" font-size="26" font-weight="700">Voices and replies</text><rect x="284" y="178" width="604" height="44" rx="8" fill="#e7eefb"/><text x="300" y="206" font-size="17">Host: Example host    /    Target: Example target    ·    Owner</text>
<text x="290" y="265" font-size="17" fill="#45536a">Proposed target voice map · #1124</text>
<path d="M284 284H888M284 354H888M284 424H888M284 494H888" stroke="#dce1e9"/>
<text x="292" y="328" font-size="18">Host default</text><text x="672" y="328" font-size="18" fill="#2057bd">Approved profile A  ⌄</text>
<text x="292" y="398" font-size="18">Target voice</text><text x="672" y="398" font-size="18" fill="#2057bd">Approved profile B  ⌄</text>
<text x="292" y="468" font-size="18">Persona overrides</text><text x="672" y="468" font-size="18" fill="#2057bd">Allowlist required   ›</text>
<rect x="288" y="520" width="180" height="40" rx="8" fill="#e7eefb"/><text x="322" y="546" font-size="17" fill="#2057bd">Preview voice</text><text x="486" y="546" font-size="15" fill="#45536a">Fixed synthetic phrase · no capture</text>
<rect x="628" y="641" width="260" height="48" rx="10" fill="#2057bd"/><text x="672" y="671" font-size="18" fill="#fff">Review changes (1)</text>
<text x="930" y="156" font-size="20" font-weight="700">Effective value</text><g font-size="17"><text x="930" y="200">Scope: selected target</text><text x="930" y="238">Origin: target override</text><text x="930" y="276">Activation: next reply</text><text x="930" y="314">Stored revision: 12</text><text x="930" y="352">Effective revision: 12</text></g>
<rect x="924" y="394" width="258" height="168" rx="10" fill="#fff0d5"/><g font-size="16"><text x="940" y="423" font-weight="600">Authority stays at the host</text><text x="940" y="456">Voice and target replies cannot</text><text x="940" y="482">approve configuration changes.</text><text x="940" y="520">Caller environment cannot</text><text x="940" y="546">silently override the voice map.</text></g>
<text x="28" y="774" font-size="17" fill="#45536a">All fields also available on iPhone and iPad. No exclusive Mac-only host configuration. Synthetic proposal.</text></g></svg>
