<svg xmlns="http://www.w3.org/2000/svg" width="860" height="920" viewBox="0 0 860 920" role="img" aria-labelledby="title desc">
<title id="title">Proposed iPhone settings and review</title><desc id="desc">Two phone panels. Settings has shared scope and groups, with active listening visible. Review shows require cue changing from true to false, owner approval, and an engine reload warning.</desc>
<rect width="860" height="920" fill="#eef1f5"/>
<g font-family="-apple-system, sans-serif" fill="#172234">
<text x="32" y="38" font-size="24" font-weight="700">iPhone · complete settings in native navigation</text>
<g transform="translate(28 60)"><rect width="390" height="828" rx="32" fill="#fff" stroke="#a5aebd"/>
<text x="22" y="34" font-size="16" fill="#a32b36">● Mic live · Listening</text><text x="22" y="76" font-size="30" font-weight="700">Settings</text>
<rect x="16" y="92" width="358" height="40" rx="10" fill="#edf0f5"/><text x="30" y="118" font-size="16">Search settings or technical key</text>
<rect x="16" y="146" width="358" height="44" rx="10" fill="#e7eefb"/><text x="28" y="174" font-size="17">Device   /   Host ✓   /   Target</text>
<text x="22" y="218" font-size="17" font-weight="600">Example host · Connected</text><text x="22" y="242" font-size="15" fill="#45536a">Owner · effective revision 12</text>
<path d="M16 260H374M16 320H374M16 380H374M16 440H374M16 500H374M16 560H374M16 620H374M16 680H374" stroke="#dce1e9"/>
<g font-size="18"><text x="24" y="298">Listening and attention             ›</text><text x="24" y="358">Privacy                                      ›</text><text x="24" y="418">Voices and replies                      ›</text><text x="24" y="478">Notifications and updates          ›</text><text x="24" y="538">Targets                                      ›</text><text x="24" y="598">Audio                                         ›</text><text x="24" y="658">Advanced and diagnostics           ›</text></g>
<rect x="16" y="700" width="358" height="48" rx="12" fill="#2057bd"/><text x="80" y="731" font-size="18" fill="#fff">Review changes (1)</text>
<text x="24" y="794" font-size="16" fill="#45536a">Station    Sessions    Devices    Settings</text></g>
<g transform="translate(442 60)"><rect width="390" height="828" rx="32" fill="#fff" stroke="#a5aebd"/>
<text x="22" y="34" font-size="16" fill="#2057bd">Cancel                                      Review</text><text x="22" y="80" font-size="27" font-weight="700">Pay attention to me</text>
<text x="22" y="116" font-size="17">Example host · Owner required</text><text x="22" y="149" font-size="15" fill="#45536a">One setting · next listening engine</text>
<rect x="16" y="176" width="358" height="138" rx="14" fill="#f0f3f8"/>
<text x="30" y="210" font-size="18" font-weight="600">Require cue for uncertain follow-up</text><text x="30" y="242" font-size="16">Current: On → Proposed: Off</text><text x="30" y="274" font-size="14" fill="#45536a">conversation.require_cue</text>
<text x="22" y="354" font-size="18" font-weight="600">Other attention gates still apply.</text><g font-size="17" fill="#45536a"><text x="22" y="387">This does not start listening or</text><text x="22" y="412">change speaker or target permissions.</text></g>
<rect x="16" y="442" width="358" height="146" rx="14" fill="#fff0d5"/><text x="30" y="474" font-size="18" font-weight="600">Reload listening engine</text><g font-size="17"><text x="30" y="506">A short part of audio may be missed.</text><text x="30" y="534">Saved and active are reported</text><text x="30" y="560">separately.</text></g>
<rect x="16" y="622" width="358" height="52" rx="12" fill="#2057bd"/><text x="43" y="654" font-size="18" fill="#fff">Authorize, save and reload</text>
<rect x="16" y="688" width="358" height="48" rx="12" fill="#e7eefb"/><text x="102" y="718" font-size="18" fill="#2057bd">Save for next start</text>
<text x="22" y="786" font-size="15" fill="#45536a">Synthetic proposal · no live values</text></g></g></svg>
