<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="760" viewBox="0 0 1140 760" role="img" aria-labelledby="title desc">
<title id="title">Proposed iPad settings</title><desc id="desc">Adaptive split layout with station navigation, settings categories and a listening form. Host scope, owner role, active microphone, exact cue rule and pending reload are visible. At compact width this collapses to a back-navigation stack.</desc>
