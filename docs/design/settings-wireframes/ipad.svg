<rect x="258" y="182" width="238" height="42" rx="8" fill="#e7eefb"/><g font-size="17"><text x="270" y="209" fill="#2057bd">Listening and attention</text><text x="270" y="264">Privacy</text><text x="270" y="316">Voices and replies</text><text x="270" y="368">Notifications and updates</text><text x="270" y="420">Targets</text><text x="270" y="472">Audio</text><text x="270" y="524">Appearance</text><text x="270" y="576">Advanced and diagnostics</text></g>
