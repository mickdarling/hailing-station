="302" y="2270" width="816" height="82" rx="10" fill="#EDF0EA"/><text x="317" y="2294" font-size="15" fill="#246956" font-weight="600">7 catalog entries · Appearance</text><text x="317" y="2317" font-size="13" fill="#68756E" font-weight="400">Continue in All settings for every field, source and prerequisite. This frame shows representative</text><text x="317" y="2336" font-size="13" fill="#68756E" font-weight="400">controls.</text><path d="M302 2378H1118" stroke="#DCE2DB"/><text x="302" y="2403" font-size="13" fill="#68756E" font-weight="400">No live configuration has changed.</text><rect x="913" y="2381" width="205" height="36" rx="7" fill="#246956"/><text x="1015.5" y="2404.0" font-size="14" fill="#FFFFFF" font-weight="550" text-anchor="middle">Review changes</text><text x="590.0" y="2588" font-size="10" fill="#68756E" font-weight="400" text-anchor="middle">STATIC DESIGN · representative category content · synthetic labels · no runtime effects</text></g></svg>