nchor="middle">+</text><rect x="1037" y="2476" width="42" height="45" rx="7" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="1058.0" y="2503.5" font-size="14" fill="#246956" font-weight="550" text-anchor="middle">…</text><rect x="1090" y="2476" width="38" height="45" rx="7" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="1109.0" y="2503.5" font-size="14" fill="#246956" font-weight="550" text-anchor="middle">Aa</text><text x="302" y="167" font-size="30" fill="#23352E" font-weight="650">Appearance and accessibility</text><text x="302" y="198" font-size="15" fill="#68756E" font-weight="400">Comfortable conversation text without changing system settings or shrinking controls.</text><rect x="302" y="233" width="816" height="66" rx="10" fill="#EAF1EB"/><text x="316" y="256" font-size="14" fill="#246956" font-weight="600">Source defaults · synthetic preview</text><text x="316" y="278" font-size="12" fill="#246956" font-weight="400">Effective state not queried. Proposed controls require supported host capabilities.</text><rect x="302" y="319" width="100" height="34" rx="7" fill="#246956"/><text x="352" y="341" font-size="13" fill="#FFFFFF" font-weight="550" text-anchor="middle">This device</text><rect x="407" y="319" width="100" height="34" rx="7" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="457" y="341" font-size="13" fill="#68756E" font-weight="550" text-anchor="middle">Host</text><rect x="512" y="319" width="100" height="34" rx="7" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="562" y="341" font-size="13" fill="#68756E" font-weight="550" text-anchor="middle">Target</text><text x="638" y="341" font-size="14" fill="#68756E" font-weight="400">Example host  /  Owner</text><text x="302" y="390" font-size="15" fill="#23352E" font-weight="650">Conversation text size · Aa</text><rect x="302" y="405" width="816" height="576" rx="12" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="322" y="441" font-size="16" fill="#23352E" font-weight="550">Current text size</text><text x="322" y="468" font-size="13" fill="#68756E" font-weight="400">App-only preference. Accessibility text scaling still applies</text><text x="322" y="487" font-size="13" fill="#68756E" font-weight="400">on top.</text><rect x="812.4000000000001" y="425" width="137.79999999999998" height="36" rx="7" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="881.3000000000001" y="448.0" font-size="14" fill="#246956" font-weight="550" text-anchor="middle">Aa  Smaller</text><rect x="960.2" y="425" width="137.79999999999998" height="36" rx="7" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="1029.1000000000001" y="448.0" font-size="14" fill="#246956" font-weight="550" text-anchor="middle">Aa  Larger</text><text x="812.4000000000001" y="489" font-size="17" fill="#23352E" font-weight="600">17 pt · default</text><text x="812.4000000000001" y="513" font-size="13" fill="#68756E" font-weight="400">Saved in this app only</text><text x="322" y="548" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">conversation-text-size.v1</text><text x="322" y="564" font-size="11" fill="#68756E" font-weight="400">This device · Owner · Immediate</text><path d="M322 606H1098" stroke="#DCE2DB"/><text x="322" y="642" font-size="16" fill="#23352E" font-weight="550">Reading preview</text><text x="322" y="669" font-size="13" fill="#68756E" font-weight="400">Reading preview. Text remains readable at your chosen size,</text><text x="322" y="688" font-size="13" fill="#68756E" font-weight="400">with room to wrap.</text><rect x="812.4000000000001" y="626" width="285.59999999999997" height="115" rx="10" fill="#F7F8F4" stroke="#DCE2DB" stroke-width="1"/><text x="827.4000000000001" y="655" font-size="17" fill="#23352E" font-weight="400">Reading preview. Text</text><text x="827.4000000000001" y="680" font-size="17" fill="#23352E" font-weight="400">remains readable at the</text><text x="827.4000000000001" y="705" font-size="17" fill="#23352E" font-weight="400">selected size.</text><text x="827.4000000000001" y="730" font-size="17" fill="#23352E" font-weight="400">Accessibility scaling</text><text x="827.4000000000001" y="755" font-size="17" fill="#23352E" font-weight="400">still applies.</text><text x="322" y="761" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">live app-only size preview</text><text x="322" y="777" font-size="11" fill="#68756E" font-weight="400">This device · Owner · Live preview</text><path d="M322 819H1098" stroke="#DCE2DB"/><text x="322" y="855" font-size="16" fill="#23352E" font-weight="550">Reset conversation size</text><text x="322" y="882" font-size="13" fill="#68756E" font-weight="400">Restores this app platform default. Never writes system font</text><text x="322" y="901" font-size="13" fill="#68756E" font-weight="400">settings.</text><rect x="812.4000000000001" y="839" width="285.59999999999997" height="36" rx="7" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="955.2" y="862.0" font-size="14" fill="#246956" font-weight="550" text-anchor="middle">Reset to app default</text><text x="322" y="939" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ConversationTextSize.Intent.reset</text><text x="322" y="955" font-size="11" fill="#68756E" font-weight="400">This device · Owner · Immediate</text><text x="302" y="1023" font-size="15" fill="#23352E" font-weight="650">Conversation layout</text><rect x="302" y="1038" width="816" height="486" rx="12" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="322" y="1074" font-size="16" fill="#23352E" font-weight="550">Expanded conversation</text><text x="322" y="1101" font-size="13" fill="#68756E" font-weight="400">Default off. Keep audio owners mounted when the conversation</text><text x="322" y="1120" font-size="13" fill="#68756E" font-weight="400">fills the view.</text><text x="812.4000000000001" y="1078" font-size="14" fill="#23352E" font-weight="400">Off</text><rect x="1053.0" y="1058" width="45" height="26" rx="13" fill="#C7CEC6"/><circle cx="1066.0" cy="1071" r="10" fill="#FFFFFF"/><text x="322" y="1158" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">station.chatExpanded</text><text x="322" y="1174" font-size="11" fill="#68756E" font-weight="400">This device · Owner · Immediate</text><path d="M322 1200H1098" stroke="#DCE2DB"/><text x="322" y="1236" font-size="16" fill="#23352E" font-weight="550">Inspector</text><text x="322" y="1263" font-size="13" fill="#68756E" font-weight="400">Optional detail only; it must not take a permanent third</text><text x="322" y="1282" font-size="13" fill="#68756E" font-weight="400">column.</text><text x="812.4000000000001" y="1240" font-size="14" fill="#23352E" font-weight="400">Closed by default</text><rect x="1053.0" y="1220" width="45" height="26" rx="13" fill="#C7CEC6"/><circle cx="1066.0" cy="1233" r="10" fill="#FFFFFF"/><text x="322" y="1320" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">StationNavigationState.inspectorPresented</text><text x="322" y="1336" font-size="11" fill="#68756E" font-weight="400">This device · Owner · Immediate</text><path d="M322 1362H1098" stroke="#DCE2DB"/><text x="322" y="1398" font-size="16" fill="#23352E" font-weight="550">System accessibility settings</text><text x="322" y="1425" font-size="13" fill="#68756E" font-weight="400">Native Dynamic Type, VoiceOver and keyboard preferences remain</text><text x="322" y="1444" font-size="13" fill="#68756E" font-weight="400">system-owned.</text><rect x="812.4000000000001" y="1382" width="285.59999999999997" height="36" rx="7" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="955.2" y="1405.0" font-size="14" fill="#246956" font-weight="550" text-anchor="middle">Open on this device</text><text x="322" y="1482" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">OS accessibility destination</text><text x="322" y="1498" font-size="11" fill="#68756E" font-weight="400">This device · Owner · System approval</text><text x="302" y="1566" font-size="15" fill="#23352E" font-weight="650">Advanced · presentation and compatibility</text><rect x="302" y="1581" width="816" height="663" rx="12" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="322" y="1617" font-size="16" fill="#23352E" font-weight="550">Available base sizes</text><text x="322" y="1644" font-size="13" fill="#68756E" font-weight="400">Current selected base is not a cap on accessibility-rendered</text><text x="322" y="1663" font-size="13" fill="#68756E" font-weight="400">size.</text><text x="812.4000000000001" y="1622" font-size="14" fill="#23352E" font-weight="500">15, 16, 17, 19, 21, 24 pt</text><text x="322" y="1701" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ConversationTextSize.Platform.steps</text><text x="322" y="1717" font-size="11" fill="#68756E" font-weight="400">This device · Owner · Inspect only</text><path d="M322 1743H1098" stroke="#DCE2DB"/><text x="322" y="1779" font-size="16" fill="#23352E" font-weight="550">Aa adoption status</text><text x="322" y="1806" font-size="13" fill="#68756E" font-weight="400">No production persistence/read site at the inventory baseline.</text><text x="322" y="1825" font-size="13" fill="#68756E" font-weight="400">These controls show the proposed wiring.</text><text x="812.4000000000001" y="1784" font-size="14" fill="#23352E" font-weight="500">Component contract exists</text><text x="322" y="1863" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ConversationTextSize production adoption</text><text x="322" y="1879" font-size="11" fill="#68756E" font-weight="400"