" stroke-width="1"/><text x="581" y="341" font-size="13" fill="#68756E" font-weight="550" text-anchor="middle">Target</text><text x="657" y="341" font-size="14" fill="#68756E" font-weight="400">Example host  /  Owner</text><text x="321" y="390" font-size="15" fill="#23352E" font-weight="650">Conversation text size · Aa</text><rect x="321" y="405" width="1057" height="557" rx="12" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="341" y="441" font-size="16" fill="#23352E" font-weight="550">Current text size</text><text x="341" y="468" font-size="13" fill="#68756E" font-weight="400">App-only preference. Accessibility text scaling still applies on top.</text><rect x="1058" y="425" width="145.0" height="36" rx="7" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="1130.5" y="448.0" font-size="14" fill="#246956" font-weight="550" text-anchor="middle">Aa  Smaller</text><rect x="1213.0" y="425" width="145.0" height="36" rx="7" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="1285.5" y="448.0" font-size="14" fill="#246956" font-weight="550" text-anchor="middle">Aa  Larger</text><text x="1058" y="489" font-size="17" fill="#23352E" font-weight="600">14 pt · default</text><text x="1058" y="513" font-size="13" fill="#68756E" font-weight="400">Saved in this app only</text><text x="341" y="548" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">conversation-text-size.v1</text><text x="341" y="564" font-size="11" fill="#68756E" font-weight="400">This device · Owner · Immediate</text><path d="M341 606H1358" stroke="#DCE2DB"/><text x="341" y="642" font-size="16" fill="#23352E" font-weight="550">Reading preview</text><text x="341" y="669" font-size="13" fill="#68756E" font-weight="400">Reading preview. Text remains readable at your chosen size, with room to wrap.</text><rect x="1058" y="626" width="300" height="115" rx="10" fill="#F7F8F4" stroke="#DCE2DB" stroke-width="1"/><text x="1073" y="655" font-size="17" fill="#23352E" font-weight="400">Reading preview. Text</text><text x="1073" y="680" font-size="17" fill="#23352E" font-weight="400">remains readable at the</text><text x="1073" y="705" font-size="17" fill="#23352E" font-weight="400">selected size.</text><text x="1073" y="730" font-size="17" fill="#23352E" font-weight="400">Accessibility scaling still</text><text x="1073" y="755" font-size="17" fill="#23352E" font-weight="400">applies.</text><text x="341" y="761" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">live app-only size preview</text><text x="341" y="777" font-size="11" fill="#68756E" font-weight="400">This device · Owner · Live preview</text><path d="M341 819H1358" stroke="#DCE2DB"/><text x="341" y="855" font-size="16" fill="#23352E" font-weight="550">Reset conversation size</text><text x="341" y="882" font-size="13" fill="#68756E" font-weight="400">Restores this app platform default. Never writes system font settings.</text><rect x="1058" y="839" width="300" height="36" rx="7" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="1208.0" y="862.0" font-size="14" fill="#246956" font-weight="550" text-anchor="middle">Reset to app default</text><text x="341" y="920" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ConversationTextSize.Intent.reset</text><text x="341" y="936" font-size="11" fill="#68756E" font-weight="400">This device · Owner · Immediate</text><text x="321" y="1004" font-size="15" fill="#23352E" font-weight="650">Conversation layout</text><rect x="321" y="1019" width="1057" height="429" rx="12" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="341" y="1055" font-size="16" fill="#23352E" font-weight="550">Expanded conversation</text><text x="341" y="1082" font-size="13" fill="#68756E" font-weight="400">Default off. Keep audio owners mounted when the conversation fills the view.</text><text x="1058" y="1059" font-size="14" fill="#23352E" font-weight="400">Off</text><rect x="1313" y="1039" width="45" height="26" rx="13" fill="#C7CEC6"/><circle cx="1326" cy="1052" r="10" fill="#FFFFFF"/><text x="341" y="1120" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">station.chatExpanded</text><text x="341" y="1136" font-size="11" fill="#68756E" font-weight="400">This device · Owner · Immediate</text><path d="M341 1162H1358" stroke="#DCE2DB"/><text x="341" y="1198" font-size="16" fill="#23352E" font-weight="550">Inspector</text><text x="341" y="1225" font-size="13" fill="#68756E" font-weight="400">Optional detail only; it must not take a permanent third column.</text><text x="1058" y="1202" font-size="14" fill="#23352E" font-weight="400">Closed by default</text><rect x="1313" y="1182" width="45" height="26" rx="13" fill="#C7CEC6"/><circle cx="1326" cy="1195" r="10" fill="#FFFFFF"/><text x="341" y="1263" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">StationNavigationState.inspectorPresented</text><text x="341" y="1279" font-size="11" fill="#68756E" font-weight="400">This device · Owner · Immediate</text><path d="M341 1305H1358" stroke="#DCE2DB"/><text x="341" y="1341" font-size="16" fill="#23352E" font-weight="550">System accessibility settings</text><text x="341" y="1368" font-size="13" fill="#68756E" font-weight="400">Native Dynamic Type, VoiceOver and keyboard preferences remain system-owned.</text><rect x="1058" y="1325" width="300" height="36" rx="7" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="1208.0" y="1348.0" font-size="14" fill="#246956" font-weight="550" text-anchor="middle">Open on this device</text><text x="341" y="1406" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">OS accessibility destination</text><text x="341" y="1422" font-size="11" fill="#68756E" font-weight="400">This device · Owner · System approval</text><text x="321" y="1490" font-size="15" fill="#23352E" font-weight="650">Advanced · presentation and compatibility</text><rect x="321" y="1505" width="1057" height="606" rx="12" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="341" y="1541" font-size="16" fill="#23352E" font-weight="550">Available base sizes</text><text x="341" y="1568" font-size="13" fill="#68756E" font-weight="400">Current selected base is not a cap on accessibility-rendered size.</text><text x="1058" y="1546" font-size="14" fill="#23352E" font-weight="500">12, 13, 14, 16, 18, 20 pt</text><text x="341" y="1606" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ConversationTextSize.Platform.steps</text><text x="341" y="1622" font-size="11" fill="#68756E" font-weight="400">This device · Owner · Inspect only</text><path d="M341 1648H1358" stroke="#DCE2DB"/><text x="341" y="1684" font-size="16" fill="#23352E" font-weight="550">Aa adoption status</text><text x="341" y="1711" font-size="13" fill="#68756E" font-weight="400">No production persistence/read site at the inventory baseline. These controls show the</text><text x="341" y="1730" font-size="13" fill="#68756E" font-weight="400">proposed wiring.</text><text x="1058" y="1689" font-size="14" fill="#23352E" font-weight="500">Component contract exists</text><text x="341" y="1768" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ConversationTextSize production adoption</text><text x="341" y="1784" font-size="11" fill="#68756E" font-weight="400">This device · Dev · Not supported</text><path d="M341 1810H1358" stroke="#DCE2DB"/><text x="341" y="1846" font-size="16" fill="#23352E" font-weight="550">Keyboard and reading-anchor behavior</text><text x="341" y="1873" font-size="13" fill="#68756E" font-weight="400">Retain the visible message and selection through reflow; respect shortcut conflicts.</text><rect x="1058" y="1830" width="300" height="36" rx="7" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="1208.0" y="1853.0" font-size="14" fill="#246956" font-weight="550" text-anchor="middle">Open details</text><text x="341" y="1911" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">presentation intent contracts</text><text x="341" y="1927" font-size="11" fill="#68756E" font-weight="400">This device · Owner · Immediate</text><path d="M341 1953H1358" stroke="#DCE2DB"/><text x="341" y="1989" font-size="16" fill="#23352E" font-weight="550">Local layout and launch options</text><text x="341" y="2016" font-size="13" fill="#68756E" font-weight="400">Development seeding stays visibly synthetic and unavailable in ineligible builds.</text><rect x="1058" y="1973" width="300" height="36" rx="7" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="1208.0" y="1996.0" font-size="14" fill="#246956" font-weight="550" text-anchor="middle">Open all fields</text><text x="341" y="2054" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">app defaults · launch controls</text><text x="341" y="2070" font-size="11" fill="#68756E" font-weight="400">This device · Dev · Next app launch</text><text x="341" y="2089" font-size="11" fill="#8E621F" font-weight="400">Consideration: Synthetic content</text><rect x="321" y="2137" width="1057" height="82" rx="10" fill="#EDF0EA"/><text x="336" y="2161" font-size="15" fill="#246956" font-weight="600">7 catalog entries · Appearance</text><text x="336" y="2184" font-size="13" fill="#68756E" font-weight="400">Continue in All settings for every field, source and prerequisite. This frame shows representative controls.</text><path d="M321 2245H1378" stroke="#DCE2DB"/><text x="321" y="2270" font-size="13" fill="#68756E" font-weight="400">No live configuration has changed.</text><rect x="1173" y="2248" width="205" height="36" rx="7" fill="#246956"/><text x="1275.5" y="2271.0" font-size="14" fill="#FFFFFF" font-weight="550" text-anchor="middle">Review changes</text><text x="720.0" y="2455" font-size="10" fill="#68756E" font-weight="400" text-anchor="middle">STATIC DESIGN · representative category content · synthetic labels · no runtime effects</text></g></svg>