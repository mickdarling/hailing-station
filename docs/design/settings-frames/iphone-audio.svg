, SFMono-Regular, Menlo, monospace">system output picker</text><text x="50" y="1755" font-size="11" fill="#68756E" font-weight="400">This device · Owner · System approval</text><text x="50" y="1774" font-size="11" fill="#8E621F" font-weight="400">Consideration: Audible output</text><path d="M50 1791H430" stroke="#DCE2DB"/><text x="50" y="1823" font-size="16" fill="#23352E" font-weight="550">Mask mic while replies play</text><text x="50" y="1870" font-size="14" fill="#23352E" font-weight="400">Off</text><rect x="385" y="1850" width="45" height="26" rx="13" fill="#C7CEC6"/><circle cx="398" cy="1863" r="10" fill="#FFFFFF"/><text x="50" y="1903" font-size="13" fill="#68756E" font-weight="400">Explicit silence to the host while speaking;</text><text x="50" y="1921" font-size="13" fill="#68756E" font-weight="400">route-specific guards may still mask.</text><text x="50" y="1947" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ambient.masksDuringReplies</text><text x="50" y="1963" font-size="11" fill="#68756E" font-weight="400">This device · Owner · Immediate</text><text x="50" y="1982" font-size="11" fill="#8E621F" font-weight="400">Consideration: Missed interruptions</text><text x="34" y="2041" font-size="15" fill="#23352E" font-weight="650">Advanced · turn taking and route checks</text><rect x="34" y="2056" width="412" height="1040" rx="12" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="50" y="2088" font-size="16" fill="#23352E" font-weight="550">Onset threshold</text><rect x="50" y="2115" width="380" height="36" rx="7" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="62" y="2138" font-size="14" fill="#23352E" font-weight="500">−35 dBFS</text><path d="M391 2115L391 2151" stroke="#DCE2DB"/><text x="402" y="2138" font-size="15" fill="#68756E" font-weight="400">−</text><text x="417" y="2138" font-size="15" fill="#68756E" font-weight="400">+</text><text x="50" y="2168" font-size="13" fill="#68756E" font-weight="400">Default −35 · allowed −60…−15 dBFS. Any sustained</text><text x="50" y="2186" font-size="13" fill="#68756E" font-weight="400">sound can take the turn.</text><text x="50" y="2212" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">reply-segments.onsetThresholdDBFS</text><text x="50" y="2228" font-size="11" fill="#68756E" font-weight="400">This device · Owner · Immediate</text><text x="50" y="2247" font-size="11" fill="#8E621F" font-weight="400">Consideration: False yields</text><path d="M50 2264H430" stroke="#DCE2DB"/><text x="50" y="2296" font-size="16" fill="#23352E" font-weight="550">Sustained onset</text><rect x="50" y="2323" width="380" height="36" rx="7" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="62" y="2346" font-size="14" fill="#23352E" font-weight="500">0.3 seconds</text><path d="M391 2323L391 2359" stroke="#DCE2DB"/><text x="402" y="2346" font-size="15" fill="#68756E" font-weight="400">−</text><text x="417" y="2346" font-size="15" fill="#68756E" font-weight="400">+</text><text x="50" y="2376" font-size="13" fill="#68756E" font-weight="400">Default 0.3 · allowed 0.05–2 s. This is not a</text><text x="50" y="2394" font-size="13" fill="#68756E" font-weight="400">speaker-recognition control.</text><text x="50" y="2420" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">reply-segments.sustainedOnset</text><text x="50" y="2436" font-size="11" fill="#68756E" font-weight="400">This device · Owner · Immediate</text><text x="50" y="2455" font-size="11" fill="#8E621F" font-weight="400">Consideration: False yields</text><path d="M50 2472H430" stroke="#DCE2DB"/><text x="50" y="2504" font-size="16" fill="#23352E" font-weight="550">Pause between segments</text><rect x="50" y="2531" width="380" height="36" rx="7" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="62" y="2554" font-size="14" fill="#23352E" font-w