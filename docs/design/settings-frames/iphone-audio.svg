ented device list.</text><text x="50" y="850" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">preferred-audio-input</text><text x="50" y="866" font-size="11" fill="#68756E" font-weight="400">This device · Owner · Route confirmation</text><text x="50" y="885" font-size="11" fill="#8E621F" font-weight="400">Consideration: Audio route</text><path d="M50 902H430" stroke="#DCE2DB"/><text x="50" y="934" font-size="16" fill="#23352E" font-weight="550">Retry preferred microphone</text><rect x="50" y="961" width="380" height="36" rx="7" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="240.0" y="984.0" font-size="14" fill="#246956" font-weight="550" text-anchor="middle">Retry input</text><text x="50" y="1014" font-size="13" fill="#68756E" font-weight="400">Explicit retry keeps the saved preference and waits</text><text x="50" y="1032" font-size="13" fill="#68756E" font-weight="400">for observed route success.</text><text x="50" y="1058" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">retryInputSelection</text><text x="50" y="1074" font-size="11" fill="#68756E" font-weight="400">This device · Owner · Route confirmation</text><text x="50" y="1093" font-size="11" fill="#8E621F" font-weight="400">Consideration: Audio route</text><path d="M50 1110H430" stroke="#DCE2DB"/><text x="50" y="1142" font-size="16" fill="#23352E" font-weight="550">Use Bluetooth headset microphone</text><text x="50" y="1189" font-size="14" fill="#23352E" font-weight="400">Off</text><rect x="385" y="1169" width="45" height="26" rx="13" fill="#C7CEC6"/><circle cx="398" cy="1182" r="10" fill="#FFFFFF"/><text x="50" y="1222" font-size="13" fill="#68756E" font-weight="400">Default off. HFP can switch AirPods to</text><text x="50" y="1240" font-size="13" fill="#68756E" font-weight="400">lower-fidelity mono call audio.</text><text x="50" y="1266" font-size="11" fill="#758178" font-wei