<svg xmlns="http://www.w3.org/2000/svg" width="480" height="3621" viewBox="0 0 480 3621" role="img" aria-labelledby="title desc"><title id="title">Iphone — Targets</title><desc id="desc">Original static settings design. Synthetic labels and source-default previews only; no runtime queries, audio, configuration writes or app behavior.</desc><g font-family="-apple-system, BlinkMacSystemFont, SF Pro Text, Helvetica Neue, Arial, sans-serif"><rect x="0" y="0" width="480" height="3621" rx="0" fill="#EAEEE7"/><rect x="8" y="18" width="464" height="3576" rx="30" fill="#FAFBF8" stroke="#DCE2DB" stroke-width="1"/><text x="36" y="52" font-size="14" fill="#23352E" font-weight="650">9:41</text><text x="442" y="52" font-size="13" fill="#23352E" font-weight="500" text-anchor="end">•••  ▰</text><path d="M38 78Q38 74 42 74Q46 74 46 78V84Q46 88 42 88Q38 88 38 84Z" fill="none" stroke="#68756E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M34 83Q34 92 42 92Q50 92 50 83" fill="none" stroke="#68756E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M42 92V96" fill="none" stroke="#68756E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="63" y="90" font-size="13" fill="#23352E" font-weight="550">Microphone off</text><rect x="18" y="108" width="444" height="3293" rx="22" fill="#F4F5F0" stroke="#DCE2DB" stroke-width="1"/><rect x="220.0" y="118" width="40" height="5" rx="3" fill="#C2CAC0"/><text x="35" y="155" font-size="14" fill="#246956" font-weight="550">‹ Categories</text><text x="240.0" y="155" font-size="16" fill="#23352E" font-weight="650" text-anchor="middle">Settings</text><text x="441" y="155" font-size="14" fill="#246956" font-weight="550" text-anchor="end">Done</text><path d="M22 3422H458" stroke="#DCE2DB"/><rect x="28" y="3437" width="340" height="46" rx="7" fill="#246956"/><text x="198.0" y="3465.0" font-size="14" fill="#FFFFFF" font-weight="550" text-anchor="middle">Tap to talk</text><rect x="376" y="3437" width="34" height="46" rx="7" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="393.0" y="3465.0" font-size="14" fill="#246956" font-weight="550" text-anchor="middle">+</text><rect x="417" y="3437" width="34" height="46" rx="7" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="434.0" y="3465.0" font-size="14" fill="#246956" font-weight="550" text-anchor="middle">…</text><text x="30" y="3502" font-size="11" fill="#68756E" font-weight="400">Synthetic destination · no audio action</text><path d="M20 3514H460" stroke="#DCE2DB"/><path d="M73.0 3531V3536" fill="none" stroke="#68756E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M77.0 3527V3540" fill="none" stroke="#68756E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M81.0 3524V3543" fill="none" stroke="#68756E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M85.0 3528V3539" fill="none" stroke="#68756E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M89.0 3531V3536" fill="none" stroke="#68756E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="81.0" y="3563" font-size="11" fill="#68756E" font-weight="400" text-anchor="middle">Station</text><path d="M178.0 3526H193.0V3537H178.0Z" fill="none" stroke="#68756E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M182.0 3540H196.0V3530" fill="none" stroke="#68756E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="187.0" y="3563" font-size="11" fill="#68756E" font-weight="400" text-anchor="middle">Sessions</text><path d="M284.0 3526H298.0V3537H284.0Z" fill="none" stroke="#68756E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M291.0 3537V3541" fill="none" stroke="#68756E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M287.0 3541H295.0" fill="none" stroke="#68756E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M297.0 3532H303.0V3543H297.0Z" fill="none" stroke="#68756E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="293.0" y="3563" font-size="11" fill="#68756E" font-weight="400" text-anchor="middle">Devices</text><path d="M391.0 3527H405.0" fill="none" stroke="#246956" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M391.0 3533H405.0" fill="none" stroke="#246956" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M391.0 3539H405.0" fill="none" stroke="#246956" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M396.0 3524V3530" fill="none" stroke="#246956" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M401.0 3530V3536" fill="none" stroke="#246956" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M395.0 3536V3542" fill="none" stroke="#246956" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="399.0" y="3563" font-size="11" fill="#246956" font-weight="600" text-anchor="middle">Settings</text><rect x="180.0" y="3583" width="120" height="5" rx="3" fill="#23352E"/><text x="34" y="185" font-size="25" fill="#23352E" font-weight="650">Targets</text><text x="34" y="216" font-size="15" fill="#68756E" font-weight="400">Selection, target permission and reply voice</text><text x="34" y="238" font-size="15" fill="#68756E" font-weight="400">remain separate decisions.</text><rect x="34" y="273" width="412" height="85" rx="10" fill="#EAF1EB"/><text x="48" y="296" font-size="14" fill="#246956" font-weight="600">Source defaults · synthetic preview</text><text x="48" y="318" font-size="12" fill="#246956" font-weight="400">Effective state not queried. Proposed controls require</text><text x="48" y="335" font-size="12" fill="#246956" font-weight="400">supported host capabilities.</text><rect x="34" y="378" width="412" height="35" rx="8" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="46" y="401" font-size="14" fill="#23352E" font-weight="550">Scope: Target</text><path d="M423 393L429 399L435 393" fill="none" stroke="#68756E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="34" y="433" font-size="12" fill="#68756E" font-weight="400">Owner · Example host · Not confirmed</text><text x="34" y="471" font-size="15" fill="#23352E" font-weight="650">Selected destination</text><rect x="34" y="486" width="412" height="624" rx="12" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="50" y="518" font-size="16" fill="#23352E" font-weight="550">Example workspace</text><text x="50" y="566" font-size="14" fill="#23352E" font-weight="500">Unconfirmed</text><text x="50" y="598" font-size="13" fill="#68756E" font-weight="400">Synthetic label only. Sending requires this</text><text x="50" y="616" font-size="13" fill="#68756E" font-weight="400">connection to confirm a live target.</text><text x="50" y="642" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">destination-selection.v1</text><text x="50" y="658" font-size="11" fill="#68756E" font-weight="400">Host · Owner · Host confirmation</text><text x="50" y="677" font-size="11" fill="#8E621F" font-weight="400">Consideration: Recipient</text><path d="M50 694H430" stroke="#DCE2DB"/><text x="50" y="726" font-size="16" fill="#23352E" font-weight="550">Choose a target</text><rect x="50" y="753" width="380" height="36" rx="7" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="240.0" y="776.0" font-size="14" fill="#246956" font-weight="550" text-anchor="middle">Open target list</text><text x="50" y="806" font-size="13" fill="#68756E" font-weight="400">Name, target ID and current binding are distinct.</text><text x="50" y="824" font-size="13" fill="#68756E" font-weight="400">Offline entries stay visible.</text><text x="50" y="850" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">HostConnectionStore.selectTarget</text><text x="50" y="866" font-size="11" fill="#68756E" font-weight="400">Host · Owner · Host confirmation</text><text x="50" y="885" font-size="11" fill="#8E621F" font-weight="400">Consideration: Recipient</text><path d="M50 902H430" stroke="#DCE2DB"/><text x="50" y="934" font-size="16" fill="#23352E" font-weight="550">Target reply voice</text><rect x="50" y="961" width="380" height="36" rx="7" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="62" y="984" font-size="14" fill="#23352E" font-weight="500">Inherit host default</text><path d="M409 976L415 982L421 976" fill="none" stroke="#68756E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="1014" font-size="13" fill="#68756E" font-weight="400">#1124 map is proposed. It is independent of a</text><text x="50" y="1032" font-size="13" fill="#68756E" font-weight="400">spoken route alias.</text><text x="50" y="1058" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">proposed target.replyVoice</text><text x="50" y="1074" font-size="11" fill="#68756E" font-weight="400">Host · Owner · Next reply</text><text x="50" y="1093" font-size="11" fill="#8E621F" font-weight="400">Consideration: Voice identity</text><text x="34" y="1152" font-size="15" fill="#23352E" font-weight="650">Permission and binding</text><rect x="34" y="1167" width="412" height="832" rx="12" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="50" y="1199" font-size="16" fill="#23352E" font-weight="550">Delivery tier</text><rect x="50" y="1226" width="380" height="36" rx="7" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="62" y="1249" font-size="14" fill="#23352E" font-weight="500">Confirm for a new grant</text><path d="M409 1241L415 1247L421 1241" fill="none" stroke="#68756E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="1279" font-size="13" fill="#68756E" font-weight="400">Open / Confirm / Locked. JSON requires an explicit</text><text x="50" y="1297" font-size="13" fill="#68756E" font-weight="400">tier; selection grants nothing.</text><text x="50" y="1323" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">policy.targets.&lt;id&gt;.tier</text><text x="50" y="1339" font-size="11" fill="#68756E" font-weight="400">Host · Owner · Live admission</text><text x="50" y="1358" font-size="11" fill="#8E621F" font-weight="400">Consideration: Target authority</text><path d="M50 1375H430" stroke="#DCE2DB"/><text x="50" y="1407" font-size="16" fill="#23352E" font-weight="550">Allow output capture</text><text x="50" y="1454" font-size="14" fill="#23352E" font-weight="400">Off for a new grant</text><rect x="385" y="1434" width="45" height="26" rx="13" fill="#C7CEC6"/><circle cx="398" cy="1447" r="10" fill="#FFFFFF"/><text x="50" y="1487" font-size="13" fill="#68756E" font-weight="400">Independent capture permission. Required explicitly</text><text x="50" y="1505" font-size="13" fill="#68756E" font-weight="400">in policy JSON.</text><text x="50" y="1531" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">policy.targets.&lt;id&gt;.capture</text><text x="50" y="1547" font-size="11" fill="#68756E" font-weight="400">Host · Owner · Live admission</text><text x="50" y="1566" font-size="11" fill="#8E621F" font-weight="400">Consideration: Output disclosure</text><path d="M50 1583H430" stroke="#DCE2DB"/><text x="50" y="1615" font-size="16" fill="#23352E" font-weight="550">Process binding</text><text x="50" y="1663" font-size="14" fill="#23352E" font-weight="500">Derived from live target</text><text x="50" y="1695" font-size="13" fill="#68756E" font-weight="400">Owner re-allows to bind a process. Do not offer an</text><text x="50" y="1713" font-size="13" fill="#68756E" font-weight="400">arbitrary editable binding string.</text><text x="50" y="1739" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">policy.targets.&lt;id&gt;.binding</text><text x="50" y="1755" font-size="11" fill="#68756E" font-weight="400">Host · Owner · Live admission</text><text x="50" y="1774" font-size="11" fill="#8E621F" font-weight="400">Consideration: Process identity</text><path d="M50 1791H430" stroke="#DCE2DB"/><text x="50" y="1823" font-size="16" fill="#23352E" font-weight="550">Ambient voice guards</text><text x="50" y="1870" font-size="14" fill="#23352E" font-weight="400">On</text><rect x="385" y="1850" width="45" height="26" rx="13" fill="#246956"/><circle cx="417" cy="1863" r="10" fill="#FFFFFF"/><text x="50" y="1903" font-size="13" fill="#68756E" font-weight="400">Default on. Off changes ambient escalation only;</text><text x="50" y="1921" font-size="13" fill="#68756E" font-weight="400">other gates remain in force.</text><text x="50" y="1947" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">policy.voiceGuards</text><text x="50" y="1963" font-size="11" fill="#68756E" font-weight="400">Host · Owner · Live admission</text><text x="50" y="1982" font-size="11" fill="#8E621F" font-weight="400">Consideration: Authority</text><text x="34" y="2041" font-size="15" fill="#23352E" font-weight="650">Advanced · names and destinations</text><rect x="34" y="2056" width="412" height="1040" rx="12" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="50" y="2088" font-size="16" fill="#23352E" font-weight="550">Spoken route name</text><rect x="50" y="2115" width="380" height="36" rx="7" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="62" y="2138" font-size="14" fill="#23352E" font-weight="500">Example workspace</text><path d="M409 2130L415 2136L421 2130" fill="none" stroke="#68756E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="2168" font-size="13" fill="#68756E" font-weight="400">1–48 characters, 1–3 supported words; unique</text><text x="50" y="2186" font-size="13" fill="#68756E" font-weight="400">normalized name.</text><text x="50" y="2212" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">routes.routes[].name</text><text x="50" y="2228" font-size="11" fill="#68756E" font-weight="400">Host · Owner · Restart host</text><text x="50" y="2247" font-size="11" fill="#8E621F" font-weight="400">Consideration: Routing</text><path d="M50 2264H430" stroke="#DCE2DB"/><text x="50" y="2296" font-size="16" fill="#23352E" font-weight="550">Aliases</text><rect x="50" y="2323" width="380" height="36" rx="7" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="240.0" y="2346.0" font-size="14" fill="#246956" font-weight="550" text-anchor="middle">No aliases</text><text x="50" y="2376" font-size="13" fill="#68756E" font-weight="400">Up to 8 aliases per entry with the same name</text><text x="50" y="2394" font-size="13" fill="#68756E" font-weight="400">constraints.</text><text x="50" y="2420" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">routes.routes[].aliases</text><text x="50" y="2436" font-size="11" fill="#68756E" font-weight="400">Host · Owner · Restart host</text><text x="50" y="2455" font-size="11" fill="#8E621F" font-weight="400">Consideration: Routing</text><path d="M50 2472H430" stroke="#DCE2DB"/><text x="50" y="2504" font-size="16" fill="#23352E" font-weight="550">Default spoken route</text><rect x="50" y="2531" width="380" height="36" rx="7" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="62" y="2554" font-size="14" fill="#23352E" font-weight="500">Select exact target</text><path d="M409 2546L415 2552L421 2546" fill="none" stroke="#68756E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="2584" font-size="13" fill="#68756E" font-weight="400">Must identify one configured route; routes never</text><text x="50" y="2602" font-size="13" fill="#68756E" font-weight="400">grant policy permission.</text><text x="50" y="2628" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">routes.default</text><text x="50" y="2644" font-size="11" fill="#68756E" font-weight="400">Host · Owner · Restart host</text><text x="50" y="2663" font-size="11" fill="#8E621F" font-weight="400">Consideration: Recipient</text><path d="M50 2680H430" stroke="#DCE2DB"/><text x="50" y="2712" font-size="16" fill="#23352E" font-weight="550">Note destinations</text><rect x="50" y="2739" width="380" height="36" rx="7" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="240.0" y="2762.0" font-size="14" fill="#246956" font-weight="550" text-anchor="middle">Open allowed handlers</text><text x="50" y="2792" font-size="13" fill="#68756E" font-weight="400">Exactly one validated Markdown or Shortcut handler</text><text x="50" y="2810" font-size="13" fill="#68756E" font-weight="400">per spoken destination.</text><text x="50" y="2836" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">destinations.&lt;name&gt;.markdown / shortcut</text><text x="50" y="2852" font-size="11" fill="#68756E" font-weight="400">Host · Owner · Restart host</text><text x="50" y="2871" font-size="11" fill="#8E621F" font-weight="400">Consideration: Local automation</text><path d="M50 2888H430" stroke="#DCE2DB"/><text x="50" y="2920" font-size="16" fill="#23352E" font-weight="550">Recovery and adapter references</text><rect x="50" y="2947" width="380" height="36" rx="7" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="240.0" y="2970.0" font-size="14" fill="#246956" font-weight="550" text-anchor="middle">Open all fields</text><text x="50" y="3000" font-size="13" fill="#68756E" font-weight="400">Secrets and exact private bindings remain redacted</text><text x="50" y="3018" font-size="13" fill="#68756E" font-weight="400">in exports.</text><text x="50" y="3044" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">target policy · routes · recovery profiles</text><text x="50" y="3060" font-size="11" fill="#68756E" font-weight="400">Host · Admin · Inspect / staged</text><text x="50" y="3079" font-size="11" fill="#8E621F" font-weight="400">Consideration: Target authority</text><rect x="34" y="3122" width="412" height="106" rx="10" fill="#EDF0EA"/><text x="49" y="3146" font-size="15" fill="#246956" font-weight="600">34 catalog entries · Targets</text><text x="49" y="3169" font-size="13" fill="#68756E" font-weight="400">Continue in All settings for every field, source</text><text x="49" y="3188" font-size="13" fill="#68756E" font-weight="400">and prerequisite. This frame shows representative</text><text x="49" y="3207" font-size="13" fill="#68756E" font-weight="400">controls.</text><path d="M34 3254H446" stroke="#DCE2DB"/><text x="34" y="3279" font-size="13" fill="#68756E" font-weight="400">No live configuration has changed.</text><rect x="34" y="3301" width="412" height="36" rx="7" fill="#246956"/><text x="240.0" y="3324.0" font-size="14" fill="#FFFFFF" font-weight="550" text-anchor="middle">Review changes</text><text x="34" y="3350" font-size="12" fill="#68756E" font-weight="400">Save later or activate explicitly after review.</text><text x="240.0" y="3611" font-size="10" fill="#68756E" font-weight="400" text-anchor="middle">STATIC DESIGN · synthetic · no runtime effects</text></g></svg>