 Dev · Next app launch</text><text x="50" y="2695" font-size="11" fill="#8E621F" font-weight="400">Consideration: Synthetic content</text><rect x="34" y="2738" width="412" height="106" rx="10" fill="#EDF0EA"/><text x="49" y="2762" font-size="15" fill="#246956" font-weight="600">7 catalog entries · Appearance</text><text x="49" y="2785" font-size="13" fill="#68756E" font-weight="400">Continue in All settings for every field, source</text><text x="49" y="2804" font-size="13" fill="#68756E" font-weight="400">and prerequisite. This frame shows representative</text><text x="49" y="2823" font-size="13" fill="#68756E" font-weight="400">controls.</text><path d="M34 2870H446" stroke="#DCE2DB"/><text x="34" y="2895" font-size="13" fill="#68756E" font-weight="400">No live configuration has changed.</text><rect x="34" y="2917" width="412" height="36" rx="7" fill="#246956"/><text x="240.0" y="2940.0" font-size="14" fill="#FFFFFF" font-weight="550" text-anchor="middle">Review changes</text><text x="34" y="2966" font-size="12" fill="#68756E" font-weight="400">Save later or activate explicitly after review.</text><text x="240.0" y="3227" font-size="10" fill="#68756E" font-weight="400" text-anchor="middle">STATIC DESIGN · synthetic · no runtime effects</text></g></svg>