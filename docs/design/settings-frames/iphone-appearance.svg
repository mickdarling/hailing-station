<svg xmlns="http://www.w3.org/2000/svg" width="430" height="900" viewBox="0 0 430 900" role="img" aria-labelledby="title desc"><title id="title">iphone — Appearance — consolidated browser</title><desc id="desc">Synthetic compact settings design. Fixed scope, search, reset, presets and review; six-item paged list and focused editor. No live settings or native validation.</desc><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
<rect x="0" y="0" width="430" height="900" rx="24" fill="#eff1ee" stroke="#dce2da"/>
<rect x="0" y="0" width="430" height="48" rx="8" fill="#fff" stroke="#dce2da"/>
<text x="20" y="30" font-size="14" fill="#24312e" font-weight="650">Example target</text>
<text x="256" y="30" font-size="11" fill="#606e67" font-weight="400">○ Mic off · demo    Aa   ⚙</text>
<rect x="6" y="52" width="418" height="732" rx="14" fill="#fff" stroke="#dce2da"/>
<text x="20" y="80" font-size="13" fill="#196e5d" font-weight="400">‹ Settings</text>
<text x="377" y="80" font-size="13" fill="#196e5d" font-weight="400">Done</text>
<text x="20" y="116" font-size="20" fill="#24312e" font-weight="650">Appearance</text>
<rect x="20" y="132" width="154" height="34" rx="7" fill="#fff" stroke="#dce2da"/>
<text x="30" y="154" font-size="12" fill="#196e5d" font-weight="600">Scope: All applicable ⌄</text>
<rect x="303" y="132" width="106" height="34" rx="7" fill="#fff" stroke="#dce2da"/>
<text x="313" y="154" font-size="12" fill="#196e5d" font-weight="600">Reset group…</text>
<rect x="20" y="176" width="390" height="36" rx="8" fill="#f7f8f5" stroke="#dce2da"/>
<text x="32" y="199" font-size="13" fill="#606e67" font-weight="400">Find a setting or exact key</text>
<text x="20" y="240" font-size="11" fill="#606e67" font-weight="400">7 entries · synthetic · owner</text>
<rect x="20" y="256" width="166" height="34" rx="7" fill="#fff" stroke="#dce2da"/>
<text x="30" y="278" font-size="12" fill="#196e5d" font-weight="600">‹ List · 6 per page</text>
<text x="314" y="278" font-size="12" fill="#606e67" font-weight="400">1 of 7</text>
<rect x="20" y="304" width="390" height="440" rx="12" fill="#fff" stroke="#dce2da"/>
<text x="36" y="332" font-size="18" fill="#24312e" font-weight="400">Conversation text size</text>
<text x="36" y="366" font-size="11" fill="#606e67" font-weight="400">hailing-station.conversation-text-size.v1</text>
<text x="36" y="391" font-size="18" fill="#24312e" font-weight="650">Aa · 17 pt app default</text>
<rect x="36" y="411" width="88" height="34" rx="7" fill="#fff" stroke="#dce2da"/>
<text x="46" y="433" font-size="12" fill="#196e5d" font-weight="600">Smaller</text>
<rect x="130" y="411" width="82" height="34" rx="7" fill="#fff" stroke="#dce2da"/>
<text x="140" y="433" font-size="12" fill="#196e5d" font-weight="600">Larger</text>
<rect x="36" y="455" width="358" height="34" rx="7" fill="#fff" stroke="#dce2da"/>
<text x="46" y="477" font-size="12" fill="#196e5d" font-weight="600">Reset to app default</text>
<text x="36" y="513" font-size="17" fill="#24312e" font-weight="400">A readable conversation with room for</text>
<text x="36" y="536" font-size="17" fill="#24312e" font-weight="400">the details.</text>
<text x="36" y="573" font-size="12" fill="#606e67" font-weight="400">Live preview · app preference only. OS text and</text>
<text x="36" y="591" font-size="12" fill="#606e67" font-weight="400">accessibility settings are unchanged.</text>
<rect x="0" y="740" width="430" height="44" rx="0" fill="#fff" stroke="#dce2da"/>
<text x="20" y="767" font-size="12" fill="#606e67" font-weight="400">No pending changes</text>
<rect x="271" y="745" width="138" height="34" rx="7" fill="#fff" stroke="#dce2da"/>
<text x="281" y="767" font-size="12" fill="#196e5d" font-weight="600">Review changes</text>
<rect x="0" y="792" width="430" height="50" rx="0" fill="#fff" stroke="#dce2da"/>
<rect x="20" y="799" width="286" height="34" rx="7" fill="#196e5d" stroke="#dce2da"/>
