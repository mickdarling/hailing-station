h="412" height="35" rx="8" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="46" y="401" font-size="14" fill="#23352E" font-weight="550">Scope: This device</text><path d="M423 393L429 399L435 393" fill="none" stroke="#68756E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="34" y="433" font-size="12" fill="#68756E" font-weight="400">Owner · Example host · Not confirmed</text><text x="34" y="471" font-size="15" fill="#23352E" font-weight="650">Conversation text size · Aa</text><rect x="34" y="486" width="412" height="728" rx="12" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="50" y="518" font-size="16" fill="#23352E" font-weight="550">Current text size</text><rect x="50" y="545" width="185.0" height="36" rx="7" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="142.5" y="568.0" font-size="14" fill="#246956" font-weight="550" text-anchor="middle">Aa  Smaller</text><rect x="245.0" y="545" width="185.0" height="36" rx="7" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="337.5" y="568.0" font-size="14" fill="#246956" font-weight="550" text-anchor="middle">Aa  Larger</text><text x="50" y="609" font-size="17" fill="#23352E" font-weight="600">17 pt · default</text><text x="50" y="633" font-size="13" fill="#68756E" font-weight="400">Saved in this app only</text><text x="50" y="663" font-size="13" fill="#68756E" font-weight="400">App-only preference. Accessibility text scaling</text><text x="50" y="681" font-size="13" fill="#68756E" font-weight="400">still applies on top.</text><text x="50" y="707" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">conversation-text-size.v1</text><text x="50" y="723" font-size="11" fill="#68756E" font-weight="400">This device · Owner · Immediate</text><path d="M50 744H430" stroke="#DCE2DB"/><text x="50" y="776" font-size="16" fill="#23352E" font-weight="550">Reading preview</text><rect x="50" y="803" width="380" height="115" rx="10" fill="#F7F8F4" stroke="#DCE2DB" stroke-width="1"/><text x="65" y="832" font-size="17" fill="#23352E" font-weight="400">Reading preview. Text remains</text><text x="65" y="857" font-size="17" fill="#23352E" font-weight="400">readable at the selected size.</text><text x="65" y="882" font-size="17" fill="#23352E" font-weight="400">Accessibility scaling still applies.</text><text x="50" y="940" font-size="13" fill="#68756E" font-weight="400">Reading preview. Text remains readable at your</text><text x="50" y="958" font-size="13" fill="#68756E" font-weight="400">chosen size, with room to wrap.</text><text x="50" y="984" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">live app-only size preview</text><text x="50" y="1000" font-size="11" fill="#68756E" font-weight="400">This device · Owner · Live preview</text><path d="M50 1021H430" stroke="#DCE2DB"/><text x="50" y="1053" font-size="16" fill="#23352E" font-weight="550">Reset conversation size</text><rect x="50" y="1080" width="380" height="36" rx="7" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="240.0" y="1103.0" font-size="14" fill="#246956" font-weight="550" text-anchor="middle">Reset to app default</text><text x="50" y="1133" font-size="13" fill="#68756E" font-weight="400">Restores this app platform default. Never writes</text><text x="50" y="1151" font-size="13" fill="#68756E" font-weight="400">system font settings.</text><text x="50" y="1177" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ConversationTextSize.Intent.reset</text><text x="50" y="1193" font-size="11" fill="#68756E" font-weight="400">This device · Owner · Immediate</text><text x="34" y="1256" font-size="15" fill="#23352E" font-weight="650">Conversation layout</text><rect x="34" y="1271" width="412" height="579" rx="12" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="50" y="1303" font-size="16" fill="#23352E" font-weight="550">Expanded conversation</text><text x="50" y="1350" font-size="14" fill="#23352E" font-weight="400">Off</text><rect x="385" y="1330" width="45" height="26" rx="13" fill="#C7CEC6"/><circle cx="398" cy="1343" r="10" fill="#FFFFFF"/><text x="50" y="1383" font-size="13" fill="#68756E" font-weight="400">Default off. Keep audio owners mounted when the</text><text x="50" y="1401" font-size="13" fill="#68756E" font-weight="400">conversation fills the view.</text><text x="50" y="1427" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">station.chatExpanded</text><text x="50" y="1443" font-size="11" fill="#68756E" font-weight="400">This device · Owner · Immediate</text><path d="M50 1464H430" stroke="#DCE2DB"/><text x="50" y="1496" font-size="16" fill="#23352E" font-weight="550">Inspector</text><text x="50" y="1543" font-size="14" fill="#23352E" font-weight="400">Closed by default</text><rect x="385" y="1523" width="45" height="26" rx="13" fill="#C7CEC6"/><circle cx="398" cy="1536" r="10" fill="#FFFFFF"/><text x="50" y="1576" font-size="13" fill="#68756E" font-weight="400">Optional detail only; it must not take a permanent</text><text x="50" y="1594" font-size="13" fill="#68756E" font-weight="400">third column.</text><text x="50" y="1620" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">StationNavigationState.inspectorPresented</text><text x="50" y="1636" font-size="11" fill="#68756E" font-weight="400">This device · Owner · Immediate</text><path d="M50 1657H430" stroke="#DCE2DB"/><text x="50" y="1689" font-size="16" fill="#23352E" font-weight="550">System accessibility settings</text><rect x="50" y="1716" width="380" height="36" rx="7" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="240.0" y="1739.0" font-size="14" fill="#246956" font-weight="550" text-anchor="middle">Open on this device</text><text x="50" y="1769" font-size="13" fill="#68756E" font-weight="400">Native Dynamic Type, VoiceOver and keyboard</text><text x="50" y="1787" font-size="13" fill="#68756E" font-weight="400">preferences remain system-owned.</text><text x="50" y="1813" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">OS accessibility destination</text><text x="50" y="1829" font-size="11" fill="#68756E" font-weight="400">This device · Owner · System approval</text><text x="34" y="1892" font-size="15" fill="#23352E" font-weight="650">Advanced · presentation and compatibility</text><rect x="34" y="1907" width="412" height="805" rx="12" fill="#FFFFFF" stroke="#DCE2DB" stroke-width="1"/><text x="50" y="1939" font-size="16" fill="#23352E" font-weight="550">Available base sizes</text><text x="50" y="1987" font-size="14" fill="#23352E" font-weight="500">15, 16, 17, 19, 21, 24 pt</text><text x="50" y="2019" font-size="13" fill="#68756E" font-weight="400">Current selected base is not a cap on</text><text x="50" y="2037" font-size="13" fill="#68756E" font-weight="400">accessibility-rendered size.</text><text x="50" y="2063" font-size="11" fill="#758178" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ConversationTextSize.Platform.steps</text><text x="50" y="2079" font-size="11" fill="#68756E" font-weight="400">This device · Owner · Inspect only</text><path d="M50 2100H430" stroke="#DCE2DB"/><text x="50" y="2132" font-size="16" fill="#23352E" font-weight="550">Aa adoption status</text><text x="50" y="2180" font-size="14" fill="#23352E" font-weight="500">Component contract exists</text><text x="50" y="2212" font-size="13" fill="#68756E" font-weight="400">No production persistence/read site at the</text><text x="50" y="2230" font-size="13" fill="#68756E" font-weight="400">inventory baseline. These controls show the</text><text x="50" y="2248" font-size="13" fill="#68756E" font-weight="400">proposed wiring.</text><text x="50" y="2274" font-