<svg xmlns="http://www.w3.org/2000/svg" width="430" height="900" viewBox="0 0 430 900" role="img" aria-labelledby="title desc"><title id="title">iphone — Notifications and updates — consolidated browser</title><desc id="desc">Synthetic compact settings design. Fixed scope, search, reset, presets and review; six-item paged list and focused editor. No live settings or native validation.</desc><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
